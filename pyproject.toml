[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-blog"
version = "0.1.0"
description = "Sidecar blog generator plugin for Zensical documentation sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-frontmatter>=1.1",
    "click>=8.1",
    "ruamel.yaml>=0.18",
]

[project.scripts]
zensical-blog = "zensical_blog.cli:cli"

[project.entry-points."zensical.plugins"]
zensical_blog = "zensical_blog.plugin:BlogPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_blog"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
